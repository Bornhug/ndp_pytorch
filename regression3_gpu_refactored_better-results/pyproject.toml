[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "better-results"
version = "0.1.0"
description = "Standalone matched GP-regression training and nested-context plotting"
requires-python = ">=3.10"
dependencies = ["matplotlib", "numpy", "torch", "tqdm"]

[tool.setuptools.packages.find]
include = ["better_results*"]

